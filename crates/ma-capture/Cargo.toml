[package]
name = "ma-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Durable audio: capture source seam, 30 s chunk writer, directory-truth recovery and verify-before-delete consolidation"

[dependencies]
ma-core-types = { path = "../ma-core-types" }
serde = { workspace = true }
serde_json = { workspace = true }
flacenc = { version = "0.5", default-features = false }
claxon = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.26", default-features = false }
