[package]
name = "ma-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "SQLite schema, forward-only migrations, per-family writer roles, relocatable artifact addressing and the purge job"

[dependencies]
ma-core-types = { path = "../ma-core-types" }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
