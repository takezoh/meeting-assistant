[package]
name = "ma-processor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Processor seam: capability declaration, staged inputs, templated argv with no shell, progress and cancellation, the failure taxonomy, and the host child protocol"

[dependencies]
ma-core-types = { path = "../ma-core-types" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.26", default-features = false }
