[package]
name = "meeting-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resident app that detects the start and end of meetings and records them automatically"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
getrandom = "0.3"
log.workspace = true
meeting-assistant-core = { path = "../core" }
open = "5"
serde.workspace = true
serde_json = "1"
tao = "0.37"
tray-icon = "0.26"
wry = { version = "0.57", default-features = false }

[dev-dependencies]
meeting-assistant-core = { path = "../core", features = ["fakes"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
signal-hook = "0.3"
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
