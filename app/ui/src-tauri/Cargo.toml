# The Tauri 2 shell. It is deliberately outside the cargo workspace (root Cargo.toml `exclude`)
# so that the workspace never needs WebView2 or webkit; the engine client is a plain Rust module
# that compiles and tests headlessly with `--no-default-features`.
[package]
name = "app-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Consent and visibility surface: engine client, countdown with cancel, recording indicator"

[workspace]

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
ma-ipc = { path = "../../../crates/ma-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
ma-session = { path = "../../../crates/ma-session" }
