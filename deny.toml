# cargo-deny configuration (contract-module-boundary-enforcement: advisories, licenses, bans).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Native inference libraries may only be linked by the processor host and its adapters;
# the crate-graph rule is enforced by `cargo xtask boundary --rule native-inference-confinement`.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
