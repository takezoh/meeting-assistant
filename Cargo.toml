# Workspace manifest. Layer membership and boundary policy live in boundary.toml
# (adr-20260903-workspace-boundary-enforcement); `cargo xtask boundary` enforces it.
[workspace]
resolver = "2"
members = ["xtask", "crates/*"]
exclude = ["xtask/tests/fixtures", "app/ui/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
cargo_metadata = "0.19"
serde_yaml = "0.9"
# Single workspace-level pin for the Windows binding (adr-20260904-windows-rs-crate-and-gnu-fidelity).
# Windows-only crates refer to it with `workspace = true` under [target.'cfg(windows)'.dependencies].
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Devices_Properties",
  "Win32_UI_Shell_PropertiesSystem",
] }
# Companion crate of the same binding release; needed by the `implement` macro for COM callbacks.
windows-core = "0.62"
