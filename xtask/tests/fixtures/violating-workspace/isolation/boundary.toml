schema = 1
[layers]
L0 = []
L1 = []
L2 = ["ma-workflow"]
L3 = ["ma-capture"]
L4 = []
L5 = ["ma-engine"]
[edges.restricted]
L4 = ["L0", "L1"]
[literals]
allow_layers = ["L4"]
[literals.class_a]
words = ["teams", "slack", "zoom", "webex", "msedge", "gmeet", "googlemeet"]
[literals.class_b]
literals = ["Teams.exe"]
[rules.capture-path-isolation]
sources = ["ma-core-types", "ma-session", "ma-capture"]
forbidden = ["ma-workflow", "ma-processor", "ma-destination", "ma-store"]
forbidden_patterns = ["ma-adapter-*", "ma-processor-*", "ma-destination-*"]
[rules.native-inference-confinement]
allowed = ["ma-processor-host"]
allowed_patterns = ["ma-processor-*"]
native_crates = ["whisper-rs", "whisper-rs-sys", "sherpa-rs", "sherpa-rs-sys", "fake-whisper-sys"]
build_script_exempt = []
[third_party]
crates = ["fake-whisper-sys", "cc", "fake-c-sys"]
