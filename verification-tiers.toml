# Verification tier registry (contract-verification-tiering). Every verification id declared by
# the canonical plan (docs/changes/*/design-plan/spine.yaml) must appear here exactly once.
# `cargo xtask verify --check-registration` enforces it; `cargo xtask verify --tier <name>` runs it.
schema = 1
plan = "docs/changes/change-20260903-phase0-repository-and-contracts/design-plan/spine.yaml"

[tiers.portable]
description = "runs on any host, including the Linux development and CI hosts"
# Contract-core crates that must build and test on a non-Windows host.
core_crates = ["ma-core-types", "ma-session", "ma-signal", "ma-detect", "ma-store", "ma-workflow", "ma-processor", "ma-destination", "ma-manifest", "ma-secure", "xtask"]

[tiers.windows]
description = "runs on a Windows 11 runner; Phase 0 is not complete until this tier reports green"
platform = "windows"

# ---- registrations are generated from the plan and must stay in sync with it ----

