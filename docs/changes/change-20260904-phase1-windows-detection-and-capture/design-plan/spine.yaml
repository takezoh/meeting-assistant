units:
- title: windows-process-package-collector
  chunk: signal-collectors
  contract_refs:
  - contract-process-package-identity
  files:
  - crates/ma-signals-windows/src/lib.rs
  - crates/ma-signals-windows/src/process.rs
  - crates/ma-signals-windows/src/package_identity.rs
  - crates/ma-signals-windows/Cargo.toml
  acceptance:
  - Given a fake process/package enumerator holding the four target applications' processes, ProcessStarted,
    ProcessStopped and PackageIdentityObserved are emitted with the expected Subject::Process fields and no other
    field, and the collector's first emitted signal is CollectorStarted.
  - Given a fake enumerator in which a target process is already running when the collector starts, the first
    ProcessStarted the collector emits for that process carries payload.restart_resync = true.
  - Given a fixture where the package-identity query fails transiently versus a process that was never packaged,
    the emitted package_family_name is None in both cases and only the collector's internal diagnostic
    distinguishes them.
  - Given cargo test --workspace and cargo clippy --workspace --all-targets -- -D warnings on a non-Windows host,
    both pass with the new module present, because every windows-rs dependency is declared under
    [target.'cfg(windows)'.dependencies] and every COM call site is behind a cfg(windows) attribute, with the fake
    enumerator as the portable backend.
  objective: Implement the Windows process-lifecycle and package-identity collector inside the ma-signals-windows
    scaffold behind the existing SignalSource seam, emitting only the closed Signal/Subject shapes ma-signal
    already defines.
  output_format: Rust modules under crates/ma-signals-windows/src implementing SignalSource plus an enumerator
    trait with a live Windows backend and a portable fake, and portable-tier unit tests.
  tool_guidance: Take every service identifier (process image name, package family name pattern) as constructor
    input supplied by the composition root from the ma-adapter-* tables; a literal in this crate fails cargo xtask
    boundary immediately. Declare the windows crate only under [target.'cfg(windows)'.dependencies] and only at
    the single workspace-pinned version.
  task_boundaries: Does not implement audio-session or microphone observation, does not implement capture, does
    not add a SignalKind or Payload field, and does not read adapter.toml files directly.

- title: windows-audio-session-mic-collector
  chunk: signal-collectors
  contract_refs:
  - contract-audio-session-mic-use
  files:
  - crates/ma-signals-windows/src/audio_session.rs
  - crates/ma-signals-windows/src/mic_use.rs
  - crates/ma-signals-windows/src/endpoint_observation.rs
  depends_on:
  - windows-process-package-collector
  acceptance:
  - Given a fake session-manager source driving session-state transitions, AudioSessionCreated,
    AudioSessionDestroyed, MicCaptureStarted and MicCaptureStopped are emitted attributed to the correct process
    subject, and each MicCaptureStarted for a browser process carries payload.process_tree_root_pid resolved from
    the process-tree lookup the collector already performs.
  - Given a fake consent-store source reporting microphone use for a process for which the fake session manager
    reported nothing, no signal is emitted and the named inconclusive-source diagnostic counter increments; given
    a consent-store window still open while the session manager reports Expired, MicCaptureStopped is emitted and
    the conflict counter increments.
  - Given a fake session manager reporting a session already Active when the collector starts, the first
    MicCaptureStarted it emits for that session carries payload.restart_resync = true.
  - Given a fake session manager whose notification registration fails, the collector reports the typed
    MicUseUnavailable startup failure on CollectorStarted and emits no microphone signal from the consent store.
  - Given a fake session bound to a non-default capture endpoint, the collector exposes that endpoint identifier
    through its non-Signal endpoint-observation API and emits no Subject::Device signal for it.
  objective: Implement microphone-use and audio-session observation from session-manager notifications with
    consent-store corroboration, and expose the per-process capture endpoint as capture-side data outside the
    signal envelope.
  output_format: Rust modules under crates/ma-signals-windows/src implementing SignalSource for audio-session and
    mic-use signals, a separate endpoint-observation accessor, and fake session-manager and consent-store
    fixtures.
  tool_guidance: Reuse the same SignalSource seam as the process collector; do not introduce a second collector
    trait, do not add an endpoint field to Payload or a Device subject to a mic signal, and keep the one-second
    latency claim attached to the session-manager path only.
  task_boundaries: Does not select which microphone endpoint is recorded (mic-endpoint-follow-session consumes the
    observation), does not open any audio stream, and does not change the detector.

- title: process-loopback-capture-source
  chunk: capture
  contract_refs:
  - contract-process-loopback-capture
  files:
  - crates/ma-capture/src/wasapi/mod.rs
  - crates/ma-capture/src/wasapi/process_loopback.rs
  - crates/ma-capture/src/wasapi/manual_fallback.rs
  - crates/ma-capture/Cargo.toml
  acceptance:
  - Given a fake activation backend that succeeds for a target application's PID, the resulting CaptureSource's
    TrackOrigin reports capture_mode = ProcessLoopback and contamination_risk = None.
  - Given a fake activation backend that fails or reports the activation type unavailable, the CaptureSource falls
    back to system loopback with capture_mode = SystemLoopback and contamination_risk = PossibleOtherApps, and a
    manual Device-mode CaptureSource remains constructible in the same test process.
  - Given a fake backend whose device mix format is 48 kHz stereo, the source resamples to 16 kHz mono before
    emitting SourceEvent::Samples and its TrackOrigin reports sample_rate = 16000 and channels = 1; given a
    backend that cannot be resampled, the source returns an activation error instead of opening a track whose
    origin rate differs from ma_capture::SAMPLE_RATE.
  - Given the Windows-tier manual procedure for v-win1-loopback-live-activation, the record states per target
    application whether single-process activation captured the same audio as process-tree activation, and that
    record is where the per-application requirement FR-107 asks for is written.
  - Given cargo test --workspace and cargo clippy --workspace --all-targets -- -D warnings on a non-Windows host,
    both pass, because the WASAPI activation backend is behind a cfg(windows) attribute, and the fake backend is the
    portable implementation of the same trait.
  objective: Implement a WASAPI-backed CaptureSource behind the existing trait using ActivateAudioInterfaceAsync
    with AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK including process-tree mode, with system-loopback fallback,
    an always-available manual path, and a format pin to the durability path's sample rate.
  output_format: Rust modules under crates/ma-capture/src/wasapi implementing CaptureSource, an activation-backend
    trait with live and fake implementations, and portable-tier fixture tests.
  tool_guidance: Implement strictly behind the existing CaptureSource trait so chunk_writer.rs, consolidate.rs and
    recovery.rs need no change; do not alter CHUNK_SAMPLES, SAMPLE_RATE, QUEUE_CAP_SAMPLES or the durability write
    order; surface a mid-session activation loss as SourceEvent::FormatChanged with a new origin, never as silent
    silence.
  task_boundaries: Does not decide which microphone endpoint to open, does not compute the leak measurement, and
    does not own the committed comparison record or its gate (the manual-verification family does).

- title: mic-endpoint-follow-session
  chunk: capture
  contract_refs:
  - contract-mic-endpoint-follows-session
  files:
  - crates/ma-capture/src/wasapi/mic_endpoint.rs
  depends_on:
  - process-loopback-capture-source
  acceptance:
  - Given an endpoint identifier supplied as an explicit function argument by the caller, the microphone
    CaptureSource opens that endpoint rather than the system default communications device; given None, it opens
    the system default and records that it did.
  - Given a supplied endpoint change delivered mid-recording, the existing TrackSegment::open_successor and
    SourceEvent::FormatChanged path is used and the successor track's origin names the new endpoint.
  - Given cargo xtask boundary, ma-capture declares no dependency on ma-signals-windows; the endpoint identifier
    crosses as a string argument from the composition root, not as a crate edge.
  objective: Select the microphone endpoint the meeting application is using from an endpoint identifier the
    composition root supplies, and re-evaluate on endpoint change through the existing successor-track mechanism.
  output_format: One Rust module under crates/ma-capture/src/wasapi implementing endpoint selection over an
    explicit Option<&str> endpoint argument, plus fixture tests.
  tool_guidance: Reuse TrackSegment::open_successor and SourceEvent::FormatChanged; do not invent a parallel
    device-change path and do not add any dependency, type import or trait from ma-signals-windows.
  task_boundaries: Does not observe the session endpoint (windows-audio-session-mic-collector owns that) and does
    not wire the two together (diagnostic-harness-composition-root owns that).

- title: echo-leak-measurement
  chunk: capture
  contract_refs:
  - contract-echo-leak-measurement
  files:
  - crates/ma-capture/src/wasapi/leak_measure.rs
  depends_on:
  - process-loopback-capture-source
  acceptance:
  - Given paired loopback and microphone fixture tracks with a synthesised 18 dB echo return loss, the computed
    value is 18 dB plus or minus 1 dB, and the record carries the window's start sample on each track, both RMS
    dBFS values and the alignment uncertainty in milliseconds.
  - Given a fixture in which no sixty-second window satisfies both the loopback-active and no-local-speech
    conditions, the outcome recorded is no_qualifying_window and no number is produced; given a session whose
    alignment uncertainty exceeds one second, the outcome recorded is inconclusive_alignment.
  - Given the measurement, no Signal is emitted and no Payload field is written; the value is carried in the
    per-application measurement record only.
  objective: Compute the echo return loss between the paired loopback and microphone tracks by the method
    adr-phase1-echo-leak-measurement-representation fixes, and emit it as a per-application measurement record.
  output_format: One Rust module under crates/ma-capture/src/wasapi computing frame RMS, window selection and the
    difference of levels, plus a serialisable per-application record and fixture tests.
  tool_guidance: Do not reuse Payload.level_dbfs and do not add a Payload field; the measurement is capture-side
    data derived from two tracks, not an observation of one subject at one instant.
  task_boundaries: Does not open any audio stream, does not decide the capture mode, and does not write the
    Windows-tier record file (the manual procedure does).

- title: two-hour-durability-harness
  chunk: capture
  contract_refs:
  - contract-two-hour-durability
  files:
  - crates/ma-capture/tests/two_hour_durability.rs
  depends_on:
  - process-loopback-capture-source
  acceptance:
  - Given a SyntheticSource driven for 115_200_000 samples at 16 kHz, the chunk manifest names exactly 240 chunks,
    the chunk directory holds exactly those files, no gap record exists, and the total sample count equals the
    produced count.
  - Given the Windows-tier manual procedure for v-win1-two-hour-live, the record states the target application,
    the wall-clock duration, the final manifest-versus-directory comparison and any gap records.
  objective: Prove the two-hour durability window on the portable tier with a synthetic source and record the real
    two-hour run against a target application as a Windows-tier manual observation.
  output_format: One integration test under crates/ma-capture/tests plus the manual procedure entry the registry
    unit registers.
  tool_guidance: Reuse CHUNK_SAMPLES, SAMPLE_RATE and QUEUE_CAP_SAMPLES from ma-capture; do not redefine chunk
    cadence for Windows sources and do not make the portable test depend on wall-clock time.
  task_boundaries: Does not implement the capture source and does not change the chunk writer.

- title: diagnostic-harness-composition-root
  chunk: composition-root
  contract_refs:
  - contract-diagnostic-session-harness
  files:
  - crates/ma-engine/Cargo.toml
  - crates/ma-engine/src/diagnostic/mod.rs
  - crates/ma-engine/src/diagnostic/session.rs
  - crates/ma-engine/src/bin/ma-diag.rs
  depends_on:
  - windows-audio-session-mic-collector
  - mic-endpoint-follow-session
  - browser-extension-poc
  acceptance:
  - Given ma-diag invoked with no subcommand or with only a listing subcommand, no collector starts, no
    CaptureSource is constructed and no file is written under the artifact root; capture starts only under the
    explicit record subcommand.
  - Given a diagnostic session driven by fake collectors, every observed signal is appended to the session's JSONL
    file before the next signal is read, so that a session terminated by cancel or by dropping the harness retains
    every signal observed up to that point; the offline replay path is the only caller of SignalTimeline::merge.
  - Given a completed session, the harness writes <timeline>.decisions.json from one decide() run over the
    persisted timeline, and the label subcommand attaches a was_meeting entry for a time range to
    <timeline>.labels.json in the existing sidecar shape.
  - Given the wiring, the harness reads the four ma-adapter-* tables under renamed Cargo.toml dependencies, passes
    their identifiers to the collectors, passes the audio-session collector's observed endpoint identifier into
    ma-capture's microphone selection, and resolves the extension listener's peer process to a process-tree root
    that ma-ext-channel copies into the tab signals' payload.
  - Given cargo xtask boundary and cargo clippy --workspace --all-targets -- -D warnings, both pass, because ma-engine is
    L5 and may depend on every lower layer, and no service identifier appears in ma-engine source because every
    adapter crate is renamed in Cargo.toml.
  objective: Give the Phase 1 composition root and diagnostic harness an owner in the existing ma-engine crate —
    wire the collectors, the capture sources, the extension channel and the detector, own live session
    start/stop/cancel and incremental persistence, and expose the label and replay commands.
  output_format: Cargo.toml dependency additions with renamed adapter crates, a diagnostic module and a second
    binary target ma-diag under crates/ma-engine, plus portable tests driven by fake collectors and fake capture
    sources.
  tool_guidance: Rename every adapter dependency in Cargo.toml (adapter_a = { package = "ma-adapter-teams" } and
    so on) so no service identifier token appears in ma-engine source; keep every new dependency compiling on a
    non-Windows host; do not touch supervisor.rs, the instance lock or ma-session.
  task_boundaries: Does not implement collectors, capture sources, detector logic or the extension; does not build
    or consult ConsentSurfaces, the countdown or the hysteresis path; does not start capture from a detector
    decision.

- title: meet-process-tree-corroboration
  chunk: detector
  contract_refs:
  - contract-meet-corroboration-required
  - contract-detector-diagnostics-explainability
  files:
  - crates/ma-detect/src/detector.rs
  - fixtures/signal-timelines/browser-tab-with-mic.jsonl
  - fixtures/signal-timelines/browser-tab-cross-tree.jsonl
  depends_on:
  - signal-timeline-fixture-corpus
  acceptance:
  - Given a browser-class adapter that requires both tab and microphone corroboration, decide() records each
    candidate's tab and microphone process_tree_root_pid and treats corroboration as met only when both are
    present and equal; browser-tab-with-mic.jsonl is updated so its mic_capture_started signal carries
    process_tree_root_pid 6300, matching the tab signal already committed with that value.
  - Given the new browser-tab-cross-tree.jsonl fixture whose tab signal carries process_tree_root_pid 6300 and
    whose mic signal carries 7100, decide() emits Inconclusive with rule_id process-tree-mismatch and never a
    determinate start; given a tab signal with no process_tree_root_pid, decide() emits Inconclusive with rule_id
    process-tree-root-absent.
  - Given the existing desktop fixtures, replay_is_byte_identical and the committed
    desktop-start-end.decisions.json remain unchanged, because a desktop-class adapter requires no tab evidence
    and the join rule does not apply to it.
  - Given each Windows-recorded Phase 1 fixture, every emitted decision cites the exact signal ids and the adapter
    rule id, asserted against the committed decisions sidecar rather than by re-deriving it.
  objective: Implement the process-tree join FR-111 and the accepted extension-channel ADR require, and assert
    decision explainability against the real Windows-recorded fixtures.
  output_format: A change to decide()'s candidate keying and rule selection in crates/ma-detect/src/detector.rs,
    one updated and one new fixture, and tests in the same crate.
  tool_guidance: Keep decide() pure and its signature unchanged, keep the Outcome enum and partition() unchanged,
    and add the join inside candidate evaluation; the two new rule ids are process-tree-mismatch and
    process-tree-root-absent.
  task_boundaries: Does not change adapter tables' corroboration flags, the evidence weights, the Outcome enum, or
    the generic-candidate fallback.

