  output_format: JSONL timeline files with .labels.json and .decisions.json sidecars under
    fixtures/signal-timelines/, plus one shape and redaction test file in ma-signal.
  tool_guidance: Reuse TimelineHeader verbatim; do not add a header field, a fixture format, or a new SignalKind;
    record the synthetic-identifier mapping in the manual record rather than in the fixture.
  task_boundaries: Does not change ma-detect's replay path, does not change the detector's join rule, and does not
