  depends_on:
  - diagnostic-harness-composition-root
  acceptance:
  - Given a diagnostic session recorded against each of the five targets (four applications, Meet with and without
    the extension), the merged timeline is written in the existing TimelineHeader-plus-JSONL shape and replays
    byte-identically through ma-detect's existing replay path against its committed decisions sidecar.
  - Given every committed Phase 1 fixture, machine_profile is exactly "redacted", every pid is a synthetic value
    from a documented mapping, and no image name, package family name or tab host is a real service identifier;
    the real observed identifiers are recorded only in the Windows-tier manual record and asserted by the L4
    adapter crates' own fixtures.
  - Given every committed Phase 1 fixture, a .labels.json sidecar exists carrying at least one was_meeting entry
