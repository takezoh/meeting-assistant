  disposition: implementation_detail. Delegated as discretion-package-identity-probe, a private, single-unit,
    reversible choice inside crates/ma-signals-windows/src/package_identity.rs whose alternatives all preserve
    package_family_name as Option<String> with None meaning "not packaged", verified by
    v-win1-process-identity-fixture. Escalates if packaged and non-packaged builds cannot be distinguished or if
    the chosen API forces a service-identifier literal outside an L4 crate.
  contract_refs:
  - contract-process-package-identity
- decision_input_ref: decision-input-engine-notification-platform
  disposition: not_applicable. Phase 1 is headless and diagnostic-first and builds no consent surface
    (NFR-105/contract-diagnostic-session-harness), so no Phase 1 contract's observable varies with the choice of
    notification platform. It remains open for the phase that builds the real consent UI and is recorded there,
    not here.
  contract_refs: []
- decision_input_ref: decision-input-windows-rs-crate-and-gnu-fidelity
  disposition: 'adopted, replacing the drafted spike-first deferral. The observable that mattered is not which
    version is pinned but that exactly one version is pinned and that the portable job stays green: a single
    workspace-level [workspace.dependencies] pin used by every Windows-only crate, all Windows code behind
    a cfg(windows) attribute with a portable fake behind the same trait, and the x86_64-pc-windows-gnu cross-check removed
    as a merge gate because its only evidence was status=candidate on one development host and the ubuntu job
    installs neither the target nor a mingw linker. Fixed by adr-phase1-windows-rs-crate-and-gnu-fidelity and
    NFR-102; the numeric version is an implementation detail no observable depends on.'
  adr_refs:
  - adr-phase1-windows-rs-crate-and-gnu-fidelity
  contract_refs:
  - contract-windows-tier-verification-registration
- decision_input_ref: decision-input-echo-leak-measurement-representation
  disposition: 'adopted, closed against the drafted default. The Payload.level_dbfs reuse is rejected: a derived
    cross-track statistic over a sixty-second window is not an observation of one subject at one instant, and
    reinterpreting a closed-schema field read by four crates would need the ADR-gated bump NFR-104 demands
    anyway. A new dedicated Payload field is rejected for the same reason. The measurement leaves the signal
    envelope entirely and lives in a per-application capture-side record, and the statistic, window selection,
    alignment basis and outcome partition are fixed by adr-phase1-echo-leak-measurement-representation.'
  adr_refs:
  - adr-phase1-echo-leak-measurement-representation
  contract_refs:
  - contract-echo-leak-measurement
- decision_input_ref: decision-input-per-app-loopback-requirement-location
  disposition: 'adopted, closed against the drafted candidate. fold (conductor under user-delegated authority,
    2026-09-04, minimality-decisions.json): the record lives in the Windows-tier measured comparison record the
    manual-verification family already commits, and Phase 1 adds no field to adapter.toml or AdapterSpec.
    Rejected alternatives: the drafted additive requires_process_tree_loopback field parsed into AdapterSpec (it
    widens an L1 contract four L4 crates, the shared conformance suite and the composition root read, and Phase 1
    adds no behavioural consumer of it — no match rule reads it, adapter_table_version is deliberately not
    bumped, and its only asserted value is the one the comparison record already states), and a new ma-store
    table keyed by application (a writer role and a migration for policy data that is not a per-recording
    observation). What the fold would otherwise lose — that the record actually covers every target application
    — is kept by the required-observation keys the procedure declares, checked by
    v-win1-loopback-requirement-record-shape and enforced by the manual-record gate. The adapter-table field is
    deferred to the phase that adds a behavioural consumer for it. Fixed by
    adr-phase1-per-application-loopback-requirement-record.'
  adr_refs:
  - adr-phase1-per-application-loopback-requirement-record
  contract_refs:
  - contract-per-app-loopback-requirement-record
  - contract-manual-verification-record
- decision_input_ref: decision-input-mic-endpoint-representation
  disposition: 'adopted. Raised by critique issue-endpoint-process-binding-not-representable: Subject is a closed
    four-variant union with additionalProperties false and a Signal carries exactly one Subject, so a
    MicCaptureStarted attributed to Subject::Process cannot also name an endpoint, and Payload has no endpoint
    field. Rejected alternatives: an ADR-gated Payload.endpoint_id bump (a field no detector consumes) and a
    paired Subject::Device signal correlated by time (no join key). Adopted: the endpoint is capture-side
    configuration, not detection evidence, so the collector exposes it through a non-Signal accessor that the
    composition root passes into ma-capture as a string argument. Fixed by
    adr-20260904-mic-endpoint-observed-outside-the-signal-envelope.'
  adr_refs:
  - adr-20260904-mic-endpoint-observed-outside-the-signal-envelope
  contract_refs:
  - contract-mic-endpoint-follows-session
  - contract-audio-session-mic-use
- decision_input_ref: decision-input-extension-endpoint-acquisition
  disposition: 'adopted. Raised by critique issue-extension-cannot-obtain-endpoint-token: an MV3 service worker
    limited to the tabs API and the loopback host can read no file and therefore learns neither the ephemeral
    port nor the per-start token. Rejected alternatives: an origin-pinned bootstrap endpoint returning the token
    (weakens the token against a same-user local process before NFR-103(a) has measured whether that matters, and
    adds a response body to a server whose responses are status-only), native messaging now (the ADR''s own named
    reversal target, which would discard the evidence the ADR asks Phase 1 to collect), and installer or
    managed-storage provisioning (Phase 1 has no installer). Adopted: the diagnostic harness writes the current
    port and token into the unpacked extension directory it is given, which changes no accepted security rule.
    Fixed by adr-20260904-extension-endpoint-provisioning-poc; provisioning for a store-installed extension is
    explicitly a later phase''s decision.'
  adr_refs:
  - adr-20260904-extension-endpoint-provisioning-poc
  contract_refs:
  - contract-extension-signal-delivery
- decision_input_ref: decision-input-verification-registry-multi-plan
  disposition: 'adopted. Raised by critique issue-verification-registry-is-single-plan. Rejected alternatives:
    repointing the single plan field at Phase 1''s spine (makes 112 Phase 0 registrations stale and breaks the
    docs design-set rule, which requires every v-* id cited by a design invariant to stay registered) and copying
    Phase 0''s ids into the Phase 1 spine (a plan would then declare contracts it does not own). Adopted: a plans
    array whose declared ids are unioned, with the single-plan field still accepted. Fixed by
    adr-20260904-verification-registry-multi-plan-and-manual-records.'
  adr_refs:
  - adr-20260904-verification-registry-multi-plan-and-manual-records
  contract_refs:
  - contract-windows-tier-verification-registration
- decision_input_ref: decision-input-manual-vs-ci-verification-split
  disposition: 'adopted. Raised by planning-source.txt''s required split and by critique
    issue-t2-checks-need-a-host-the-ci-runner-is-not. Rejected alternatives: leaving the six checks registered as
    unattended commands on windows-latest (they would fail for want of an installed application or pass
    vacuously) and dropping them (they are PLAN section 6 Phase 1 exit criteria). Adopted: a declared procedure
    per manual id and a committed record, gated by cargo xtask manual-record, which the hosted runner can execute
    even though it cannot make the observation. Fixed by contract-manual-verification-record.'
  adr_refs:
  - adr-20260904-verification-registry-multi-plan-and-manual-records
  contract_refs:
  - contract-manual-verification-record
- decision_input_ref: decision-input-process-tree-join-owner
  disposition: 'adopted. Raised by critique issue-meet-process-tree-join-unimplemented and
    issue-process-tree-root-pid-producer-unassigned: FR-111 and the accepted extension-channel ADR both require
    the same-process-tree join, but process_tree_root_pid is read nowhere and produced nowhere. Rejected
    alternatives: leaving ma-detect fixed and asserting the property in the adapter tables (a table cannot
    compare two signals) and adding a new SignalKind carrying the pair (a new closed-schema variant for a fact
    two existing signals already carry). Adopted: decide() performs the join over the existing Payload field,
    the Windows collector populates it from the process-tree lookup it already performs, and the extension
    channel copies it from an additive transport-supplied Request field. Fixed by
    adr-20260904-detector-process-tree-corroboration-join.'
  adr_refs:
  - adr-20260904-detector-process-tree-corroboration-join
  contract_refs:
  - contract-meet-corroboration-required
  - contract-audio-session-mic-use
  - contract-extension-trust-reversal-check
