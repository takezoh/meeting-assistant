    with AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK including process-tree mode, per-application availability
    probed at runtime, system-loopback fallback with contamination_risk = PossibleOtherApps on activation
    failure. Comparison baseline system-loopback-only capture is rejected as the primary path because it leaves
    CaptureMode::ProcessLoopback unused for the three desktop applications it exists for. Fixed by
    adr-phase1-windows-audio-signal-observation-apis and contract-process-loopback-capture.'
