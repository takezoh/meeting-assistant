scope_expansion_signals:
- id: scope-signal-manual-verification-record-family
  kind: critic_induced_contract
  target_ref: contract-manual-verification-record
  witness: Nine Phase 1 T2 identifiers require a real target application, real acoustics, real Chrome policy or
    two hours of wall clock, none of which the hosted windows-latest runner provides, and two of the draft's
    entries carried no command at all. Both the normative contract and the operational artefacts it introduces
    (manual-verification.toml, the required-observation keys a procedure declares, the committed records and the
    manual-record subcommand) are retained under this one target because verification-tiers.toml's
    Registration.command is a required non-empty string and check_registration has no notion of an observation a
    human performs, so without them these checks either pass vacuously or cannot be registered at all. The
    required-observation keys are the smaller replacement for the folded adapter-table field, keeping FR-107's
    per-application record falsifiable inside a Phase 1 policy file instead of widening the L1 adapter contract.
  requirement_refs:
  - NFR-106
  - NFR-101
  - FR-107
  authority_refs:
  - planning-source.txt (Windows 実機/実アプリを要する検証は CI の windows job と手動検証手順に振り分ける)
  - critique issue-t2-checks-need-a-host-the-ci-runner-is-not
  - critique issue-null-command-verifications-cannot-register
  - minimality-decisions.json scope-signal-adapter-table-additive-field (fold, conductor under user-delegated
    authority 2026-09-04)
- id: scope-signal-composition-root-and-harness
  kind: critic_induced_contract
  target_ref: contract-diagnostic-session-harness
  witness: Four contracts delegated wiring to "the composition root" while crates/ma-engine/Cargo.toml depended
    on none of ma-signal, ma-detect, ma-capture, ma-signals-windows or any adapter crate and no unit listed a
    ma-engine file; without an owner, implementations place the harness in different crates, and placing it in
    ma-signals-windows would itself be an L3 to L3 boundary violation.
  requirement_refs:
  - FR-108
  - FR-109
  - FR-112
  - NFR-105
  authority_refs:
  - critique issue-composition-root-and-harness-unowned
  - critique issue-live-timeline-merge-control-flow-unspecified
  - critique issue-confirmation-label-surface-unowned
- id: scope-signal-verification-registry-multi-plan
  kind: compatibility_operation
  target_ref: contract-windows-tier-verification-registration
  witness: verify.rs reads a single file.plan path and reports "registered but not declared by the plan (stale
    registration)" for every id outside it; pointing that field at Phase 1's spine would make all 112 Phase 0
    registrations stale, including the ids docs/design invariants cite and the design-set docs rule requires to
    stay registered.
  requirement_refs:
  - FR-116
  authority_refs:
  - critique issue-verification-registry-is-single-plan
  - xtask/src/verify.rs check_registration
- id: scope-signal-recorded-windows-fixtures-committed
  kind: persistent_state
  target_ref: contract-replayable-timeline-fixtures
  witness: Five new fixtures recorded from real Windows sessions become committed repository state carrying real
    host facts unless redacted; boundary.toml confines service identifiers to L4 crates and the five Phase 0
    fixtures already use machine_profile "redacted" with synthetic identifiers, so the recordings are retained
    only under that same convention.
  requirement_refs:
  - FR-108
  - FR-112
  authority_refs:
  - PLAN.md section 6 Phase 1 (recorded signal timelines can be replayed as detector test fixtures)
  - critique issue-real-identifiers-and-host-data-enter-committed-fixtures
- id: scope-signal-detector-join-adr
  kind: critic_induced_contract
  target_ref: adr-20260904-detector-process-tree-corroboration-join
  witness: The draft carried no ADR for the corroboration join because it asserted the join was "not new logic,
    already enforced twice". Neither cited enforcement compares process trees, and process_tree_root_pid is read
    nowhere in ma-detect, so closing the blocker required a new recorded decision that changes a crate Phase 0
    declared fixed and pure. Without it the change to decide() would be an unattributed behaviour change to the
    condition under which any browser meeting is detected.
  requirement_refs:
  - FR-111
  authority_refs:
  - critique issue-meet-process-tree-join-unimplemented
  - critique issue-process-tree-root-pid-producer-unassigned
  - adr-20260903-extension-localhost-channel-trust (same browser process tree clause)
- id: scope-signal-mic-endpoint-representation-adr
  kind: critic_induced_contract
  target_ref: adr-20260904-mic-endpoint-observed-outside-the-signal-envelope
  witness: The draft left the endpoint representation unstated, and the critique showed the three candidate
    implementations are mutually exclusive and observably different. Subject is a closed four-variant union and a
    Signal carries one Subject, so the choice between a schema bump, an L3 to L3 crate edge and a non-Signal
    accessor cannot be left to the implementer; recording it is what keeps NFR-104 intact without a schema
    version bump.
  requirement_refs:
  - FR-105
  - NFR-104
  authority_refs:
  - critique issue-endpoint-process-binding-not-representable
  - critique issue-mic-endpoint-requires-l3-to-l3-edge
- id: scope-signal-extension-provisioning-adr
  kind: critic_induced_contract
  target_ref: adr-20260904-extension-endpoint-provisioning-poc
  witness: The draft named no acquisition path for the listener port and per-start token, and an MV3 service
    worker limited to the tabs API and the loopback host can read neither, so FR-110 and A-02 were unsatisfiable
    as drafted. The three alternatives all touch an accepted security decision, so the choice is recorded rather
    than left to the implementer or silently deferred.
  requirement_refs:
  - FR-110
  authority_refs:
  - critique issue-extension-cannot-obtain-endpoint-token
  - adr-20260903-extension-localhost-channel-trust (per-start token and pinned origin)
- id: scope-signal-verification-registry-adr
  kind: compatibility_operation
  target_ref: adr-20260904-verification-registry-multi-plan-and-manual-records
  witness: The draft owned no mechanism for a second canonical plan and registered two verifications with no
    command at all. Both the plans union and the manual-record gate change how an existing green check behaves
    across phases, so the compatibility rule and the rejected alternatives are recorded rather than implied by a
    configuration edit.
  requirement_refs:
  - FR-116
  - NFR-106
  authority_refs:
  - critique issue-verification-registry-is-single-plan
  - critique issue-t2-checks-need-a-host-the-ci-runner-is-not
  - planning-source.txt (CI の windows job と手動検証手順への振り分け)
- id: scope-signal-composition-root-component
  kind: critic_induced_contract
  target_ref: component-engine-composition-root
  witness: The draft listed no component for crates/ma-engine, whose Cargo.toml depends on none of ma-signal,
    ma-detect, ma-capture, ma-signals-windows or any adapter crate, while four contracts delegated wiring to "the
    composition root". The component is added because boundary.rs skips the layer check only at the top rank, so
    L5 is the sole legal owner of that wiring and an unowned harness would land in an L3 crate.
  requirement_refs:
  - FR-108
  - FR-109
  - FR-112
  - NFR-105
  authority_refs:
  - critique issue-composition-root-and-harness-unowned
  - xtask/src/boundary.rs (rank equals top skips the edge check)
- id: scope-signal-manual-record-component
  kind: critic_induced_contract
  target_ref: component-manual-verification-record
  witness: The draft had no owner for a verification whose observation the hosted runner cannot make, and
    Registration.command is a required non-empty string, so the two command-less entries could not be registered
    and six more would have run unattended on a runner with no target application installed. The component
    exists to own manual-verification.toml and the committed records that make those checks falsifiable.
  requirement_refs:
  - NFR-106
  - NFR-101
  authority_refs:
  - critique issue-t2-checks-need-a-host-the-ci-runner-is-not
  - critique issue-null-command-verifications-cannot-register
