artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

requirements:
- id: FR-101
  type: functional
  priority: must
  statement: The Windows signal collector shall observe process lifecycle and package identity for Teams Desktop,
    Slack Huddle, Zoom Desktop, and the browser processes hosting Google Meet, using only OS process- and
    package-enumeration APIs, and shall emit ProcessStarted, ProcessStopped, and PackageIdentityObserved signals
    carrying Subject::Process{pid, image_name, package_family_name} with no window title, control label, or
    DOM-derived text in any field.
- id: FR-102
  type: functional
  priority: must
  statement: The Windows signal collector shall observe per-process audio-session lifecycle and microphone-capture
    state for the same four target applications and shall emit AudioSessionCreated, AudioSessionDestroyed,
    MicCaptureStarted, and MicCaptureStopped signals attributed to the owning process, from the session-manager
    notification source only, within a one-second observation-latency bound measured on that primary source; the
    consent-store poll shall corroborate and shall never by itself cause a signal to be emitted.
- id: FR-103
  type: functional
  priority: must
  statement: When a target application's process is capturing audio and process-specific (including process-tree)
    loopback activation succeeds, ma-capture shall provide a CaptureSource whose TrackOrigin records
    capture_mode = ProcessLoopback, contamination_risk = None, sample_rate = 16000 and channels = 1 for that
    application's meeting-audio track.
- id: FR-104
  type: functional
  priority: must
  statement: If process-specific loopback activation is unavailable or fails for a target application, ma-capture
    shall fall back to system (default-endpoint) loopback capture, recording capture_mode = SystemLoopback and
    contamination_risk = PossibleOtherApps on the resulting track, and a manual-start capture path (Device-mode
    CaptureSource selected by explicit user action) shall remain available independent of the loopback outcome.
- id: FR-105
  type: functional
  priority: must
  statement: When a target application has an active audio-capture session on a specific microphone endpoint, the
    system shall open that same endpoint for the recorded microphone track rather than the system default
    communications device, taking the endpoint identifier as an explicit input supplied by the composition root
    from the audio-session collector's observation rather than through the signal envelope, and shall re-evaluate
    the selection through the existing SourceEvent::FormatChanged / successor-track path when the meeting
    application's endpoint changes mid-session.
- id: FR-106
  type: functional
  priority: must
  statement: While a target application is recording on a speaker (non-headphone) audio path, the system shall
    compute the echo return loss between the loopback track and the concurrently captured microphone track as the
    difference of their root-mean-square levels in dBFS over one qualifying sixty-second window, and shall record
    that value per application together with the window's position on both tracks, both level values and the
    session's alignment uncertainty, or shall record an explicit no-qualifying-window or inconclusive-alignment
    outcome instead of a number.
- id: FR-107
  type: functional
  priority: must
  statement: The system shall record, per target application and independent of any single recording, whether
    process-tree loopback rather than single-process loopback is required to capture that application's meeting
    audio completely, and that recorded value shall be derived from a measured comparison of the two activation
    modes against the same application rather than authored by hand.
- id: FR-108
  type: functional
  priority: must
  statement: Every Phase 1 diagnostic session's signal timeline shall be appended to durable storage as each signal
    is observed, using the existing TimelineHeader-plus-JSONL fixture shape already committed under
    fixtures/signal-timelines/, so that a session ended by stop, by cancel or by a crash retains the signals
    observed before that point, and each persisted fixture shall be replayable by the existing detector-replay
    test path without modification to that path.
- id: FR-109
  type: functional
  priority: must
  statement: The system shall provide the person conducting a Phase 1 diagnostic session an explicit command that
    records a "was this a meeting?" confirmation for one or more time ranges of a captured timeline, persisted
    using the existing <timeline>.labels.json sidecar shape (timeline, labels[{from_monotonic_ns, to_monotonic_ns,
    was_meeting, note}]).
- id: FR-110
  type: functional
  priority: must
  statement: The detection-only browser extension shall report the active tab's host and audible state for Google
    Meet tabs to the desktop application over the existing localhost extension channel, using only the fields
    already defined by ExtensionMessage and only the browser's tabs API from its background service-worker
    context, and shall obtain the listener's port and per-start token from an endpoint file that the diagnostic
    harness writes into the unpacked extension directory, never from a filesystem, nativeMessaging or
    broad-host permission.
- id: FR-111
  type: functional
  priority: must
  statement: The detector shall treat an extension tab signal and an operating-system microphone-use signal as
    corroborating each other only when both carry payload.process_tree_root_pid and the two values are equal, and
    shall otherwise return Inconclusive with a rule identifier naming whether the join key was absent or
    mismatched, so that no determinate Google Meet start is produced from extension tab evidence alone or from
    microphone use in a different browser process tree.
- id: FR-112
  type: functional
  priority: must
  statement: When a Phase 1 diagnostic session ends, the system shall write the detector's decision output for that
    session's timeline to a committed <timeline>.decisions.json sidecar citing the signal identifiers and adapter
    rule id of every decision, so that the diagnostics are inspectable per session without re-running the
    detector.
- id: FR-113
  type: functional
  priority: must
  statement: A Phase 1 capture session against any of the four target applications shall complete a two-hour
    recording through the existing chunk-writer and manifest durability path without data loss, as measured on the
    Windows verification tier.
- id: FR-114
  type: functional
  priority: must
  statement: The capture-path-isolation rule in boundary.toml shall name ma-signals-windows and ma-ext-channel as
    additional sources, alongside the existing ma-core-types, ma-session and ma-capture, so the mechanically
    enforced rule matches the module-boundaries.md INV-002 wording that no capture-path crate reaches ma-workflow,
    ma-processor, ma-destination, ma-store, or any adapter crate.
- id: FR-115
  type: functional
  priority: must
  statement: When a Phase 1 collector starts or restarts while a condition it observes is already true, it shall
    emit CollectorStarted as its first signal and shall set payload.restart_resync on the first signal it emits
    for that already-true condition, so the detector's existing resync-no-autostart rule downgrades it instead of
    treating a collector restart as a fresh meeting start.
- id: FR-116
  type: functional
  priority: must
  statement: The verification registry shall declare every canonical plan whose verification identifiers it holds
    and shall treat the union of those plans' declared identifiers as the registered set, so that adding Phase 1's
    plan does not make any Phase 0 registration stale and no plan's identifier can be registered twice.
- id: NFR-101
  type: non_functional
  priority: must
  statement: Every Phase 1 verification that requires real Windows OS behavior, a real target application, or real
    Chrome/Edge extension policy shall be registered with platform = windows in verification-tiers.toml and shall
    run in the existing CI windows job; no such verification shall be treated as satisfied by a portable-tier run
    alone.
- id: NFR-102
  type: non_functional
  priority: must
  statement: Every Windows-only dependency shall be declared under [target.'cfg(windows)'.dependencies] against a
    single workspace-level pinned version, every WASAPI or COM call site shall be behind a cfg(windows) attribute, with a
    portable fake backend behind the same trait, and cargo test --workspace and cargo clippy --workspace
    --all-targets -- -D warnings shall stay green on the ubuntu portable job after Phase 1 lands.
- id: NFR-103
  type: non_functional
  priority: must
  statement: The endpoint descriptor writer shall apply the owner-only security descriptor it already builds to
    endpoint.json before the file is used, and Phase 1 shall add Windows-tier verifications that observe (a)
    whether that applied DACL in fact prevents another same-user process from reading the token and (b) whether
    Chrome/Edge policy permits the detection-only extension to reach the loopback listener; the localhost-channel
    design in adr-20260903-extension-localhost-channel-trust shall not be superseded until both observations are
    recorded, and either observation showing a violation of the intended trust model shall be raised as a decision
    open for consultation rather than silently continuing.
- id: NFR-104
  type: non_functional
  priority: must
  statement: Every new Windows-observed datum shall be represented using an existing SignalKind, Subject or Payload
    field, or shall be carried outside the signal envelope entirely as capture-side or diagnostic data;
    introducing a new field or variant into the closed schema requires a schema_version bump proposed as an ADR,
    never an ad hoc addition.
- id: NFR-105
  type: non_functional
  priority: must
  statement: The Phase 1 diagnostic harness shall start capture only under an explicit operator-supplied
    subcommand, shall neither construct nor consult ConsentSurfaces, the countdown or the hysteresis path, and
    shall add no code path by which a detector decision alone can start a recording.
- id: NFR-106
  type: non_functional
  priority: must
  statement: Every Phase 1 verification whose observation cannot be made by an unattended hosted runner shall
    declare a manual verification procedure with a named owner, host profile, steps, artifact, pass criterion and
    the set of observations its record must carry, and its registered command shall fail when the corresponding
    record is absent, records an outcome other than pass, omits an observation the procedure declares as
    required, or was produced against a different revision of the procedure.

