contracts:
- id: contract-process-package-identity
  dimension: signal_observation
  owner: component-signals-windows
  requirement_refs:
  - FR-101
  - FR-115
  unit_refs:
  - windows-process-package-collector
  adr_refs:
  - adr-phase1-windows-rs-crate-and-gnu-fidelity
  verification:
  - id: v-win1-process-identity-fixture
    tier: T0
    command: cargo test -p ma-signals-windows process_identity_from_fake_enumerator
  - id: v-win1-collector-restart-resync-fixture
    tier: T0
    command: cargo test -p ma-signals-windows restart_while_condition_true_sets_restart_resync
  - id: v-win1-process-identity-live-probe
    tier: T2
    command: cargo xtask manual-record --id v-win1-process-identity-live-probe --require pass
  discretion:
  - id: discretion-package-identity-probe
    unit_ref: windows-process-package-collector
    question: Which exact Windows AppModel call sequence distinguishes a non-packaged process (a classic Win32
      executable) from a packaged process whose package-identity query failed transiently, so that
      package_family_name = None always means "not packaged" and never "unknown"?
    scope:
      files:
      - crates/ma-signals-windows/src/package_identity.rs
      component: component-signals-windows
      visibility: private
    escalate_when:
    - a target application ships both packaged and non-packaged builds and repeated probes cannot tell them apart
    - the chosen API needs a package-family-name pattern that would force a service identifier literal outside an
      L4 adapter crate
    preserves:
      contract_refs:
      - contract-process-package-identity
      invariant_refs:
      - package_family_name stays Option<String> with None meaning "not packaged", never "unknown"
    verification_refs:
    - v-win1-process-identity-fixture
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: bounded
      verification_strength: mechanical_partial
      runtime_risk: normal
      coupling: independent
      grounding: evidenced

- id: contract-audio-session-mic-use
  dimension: signal_observation
  owner: component-signals-windows
  requirement_refs:
  - FR-102
  - FR-115
  unit_refs:
  - windows-audio-session-mic-collector
  adr_refs:
  - adr-phase1-windows-audio-signal-observation-apis
  verification:
  - id: v-win1-mic-use-fixture
    tier: T0
    command: cargo test -p ma-signals-windows mic_use_from_fake_session_manager
  - id: v-win1-mic-use-source-precedence
    tier: T0
    command: cargo test -p ma-signals-windows consent_store_never_emits_a_signal_alone
  - id: v-win1-mic-use-latency-live
    tier: T2
    command: cargo xtask manual-record --id v-win1-mic-use-latency-live --require pass
  partition:
    outcomes:
    - determinate
    - unknown
    - inconclusive
    - conflicting
    default_policy: the session-manager notification is the only source that may cause a signal; determinate is a
      session-state transition observed for a matched process, which emits MicCaptureStarted or MicCaptureStopped
      within one second; unknown is the absence of both sources for a process, which emits nothing; inconclusive
      is a consent-store usage window with no corresponding session-manager transition, which emits nothing and
      increments a named collector diagnostic; conflicting is a consent-store window still open while the session
      manager reports Inactive or Expired, in which the session manager wins, MicCaptureStopped is emitted and the
      conflict is counted; and a total failure to register for session notifications is the typed startup failure
      MicUseUnavailable, reported on CollectorStarted, never a silent degradation to consent-store-only signals

