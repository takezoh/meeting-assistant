- title: browser-extension-poc
  chunk: extension
  contract_refs:
  - contract-extension-signal-delivery
  files:
  - extension/manifest.json
  - extension/background.js
  - extension/README.md
  - crates/ma-ext-channel/tests/extension_poc.rs
  acceptance:
  - Given the extension loaded unpacked in Chrome with a Google Meet tab open, the background service worker reads
    the harness-written endpoint file from its own directory, posts host and audible for the active tab using only
    ExtensionMessage's existing fields, and receives 204.
  - Given the manifest, permissions are exactly ["tabs"] plus host permission "http://127.0.0.1/*", there is no
    content_scripts key, no scripting, nativeMessaging, storage or <all_urls> permission, and no code path reads
    tab.url beyond its hostname; asserted mechanically by the manifest test.
  - Given a 401 from the listener because the engine restarted and the token rotated, the worker stops posting and
    records the condition rather than retrying with a dead token.
  objective: Build the detection-only manifest-v3 extension PoC that speaks the existing extension-channel wire
    contract using only the tabs API and the harness-provisioned endpoint file.
  output_format: An unpacked extension source tree under extension/ (manifest.json, background.js, README.md) with
    no framework and no content script, plus one Rust test in ma-ext-channel that reads the manifest.
  tool_guidance: Use chrome.tabs.query and chrome.tabs.onUpdated for host and audible only; never send a title, a
    URL path or a query string; do not add a permission beyond tabs and the loopback host; treat the generated
    endpoint file as untracked build output.
  task_boundaries: Does not implement server-side validation, does not capture tab audio (an explicit PLAN
    non-goal), and does not change ExtensionMessage or the wire schema.

- title: extension-endpoint-acl-and-trust-checks
  chunk: security
  contract_refs:
  - contract-extension-trust-reversal-check
  files:
  - crates/ma-ext-channel/src/auth.rs
  - crates/ma-ext-channel/src/server.rs
  - crates/ma-ext-channel/tests/trust_reversal.rs
  acceptance:
  - Given EndpointDescriptor::write, the owner-only SecurityDescriptor it already builds is applied to
    endpoint.json through an injected applier before the path is returned; a fake applier in the portable test
    records the call and the descriptor, and on Windows the applier sets the file's DACL from the descriptor's
    SDDL.
  - Given a live Windows run, whether endpoint.json is readable by another same-user process is recorded as a
    pass or a fail, never skipped; given a live Chrome or Edge run under current policy, whether the
    detection-only extension can reach the loopback listener is recorded in the manual record, never skipped.
  - Given Request, an additive peer_process_tree_root_pid field supplied by the transport is copied by
    signals_for into Payload.process_tree_root_pid on every emitted tab signal; ExtensionMessage,
    Authenticator.check, the token generation, the rate, freshness and queue limits and the rejection status
    table are unchanged.
  objective: Apply the endpoint descriptor's ACL that Phase 0 only built, carry the peer process tree root into
    tab signals, and record the two trust-reversal observations adr-20260903-extension-localhost-channel-trust
    assigns to Phase 1 without pre-judging their outcome.
  output_format: An injected ACL applier and its Windows implementation in auth.rs, an additive Request field
    copied in server.rs, one integration test file, and the manual procedure entry for the browser-policy
    observation.
  tool_guidance: Do not change the descriptor's shape, Authenticator.check, the token lifetime or the wire schema;
    an observation that violates the intended trust model is recorded and raised as an open decision, not worked
    around.
  task_boundaries: Does not decide whether to supersede the ADR, does not add a bootstrap or discovery endpoint,
    and does not change the extension's provisioning mechanism.

- title: boundary-capture-path-scope
  chunk: repository-policy
  contract_refs:
  - contract-capture-path-isolation-scope
  files:
  - boundary.toml
  - xtask/tests/boundary_policy.rs
  acceptance:
  - Given boundary.toml with ma-signals-windows and ma-ext-channel added to [rules.capture-path-isolation].sources,
    cargo xtask boundary --rule capture-path-isolation stays green on the clean workspace and the negative fixture
    still reports exactly its planted violations.
  - Given the xtask test, the rule's sources list is asserted to contain every crate the design documents call a
    capture-path crate, so shortening the list is a failure rather than a silently smaller scan.
  objective: Extend the capture-path-isolation rule's source list to match module-boundaries.md INV-002 and make
    the completeness of that list mechanically checked.
  output_format: A boundary.toml sources-list edit and one xtask test asserting list completeness.
  tool_guidance: Do not add a new boundary rule, forbidden target, literal class or layer assignment; extend the
    existing rule's sources list only.
  task_boundaries: Does not change xtask/src/boundary.rs logic and does not touch the native-inference rule.

- title: verification-registry-multi-plan-and-manual-records
  chunk: repository-policy
  contract_refs:
  - contract-windows-tier-verification-registration
  - contract-manual-verification-record
  - contract-per-app-loopback-requirement-record
  files:
  - verification-tiers.toml
  - manual-verification.toml
  - xtask/src/verify.rs
  - xtask/src/manual_record.rs
  - xtask/src/main.rs
  - xtask/tests/registration.rs
  - docs/changes/change-20260904-phase1-windows-detection-and-capture/manual-verification/*.json
  depends_on:
  - process-loopback-capture-source
  acceptance:
  - Given verification-tiers.toml declaring plans = [Phase 0's spine, Phase 1's spine], cargo xtask verify
    --check-registration treats the union of their declared ids as the registered set, reports no stale
    registration for any Phase 0 id, and still rejects an id registered twice or absent.
  - Given manual-verification.toml declaring one procedure per manual verification id with owner, host profile,
    steps, artifact path, pass criterion and the observation keys the record must carry, cargo xtask
    manual-record --id X --require pass exits non-zero when the record is missing, when its outcome is not pass,
    when it omits a declared required observation, or when its recorded procedure digest differs from the current
    procedure text.
  - Given the procedure for v-win1-loopback-requirement-live-comparison, its required observation keys are exactly
    the adapter table ids discovered under crates/ma-adapter-*/adapter.toml, and a fixture record that omits one
    of them is rejected; the keys are read from the tables rather than written as literals, so no service
    identifier enters xtask.
  - Given the xtask tests, every plan-declared id whose registered command is a manual-record invocation has a
    matching procedure entry, and every procedure entry names a plan-declared id.
  - Given cargo xtask verify --check-registration, every Phase 1 T2 id is registered in the windows tier with
    platform = "windows" and every T0 and T1 id in the portable tier.
  objective: Extend the verification registry to hold more than one canonical plan and to gate manual
    observations on a committed, non-stale, observation-complete record, then register every Phase 1
    verification id and declare the per-application loopback-requirement comparison as one of those procedures.
  output_format: A plans array in verification-tiers.toml with the single-plan form still accepted, a
    manual-verification.toml procedure table carrying required-observation keys, a manual_record subcommand in
    xtask, the registrations, and xtask tests.
  tool_guidance: Keep the existing single-plan field working so no other repository consumer breaks; keep records
    as plain JSON outside docs lint targets; do not weaken the existing exactly-once and tier-matching rules;
    read the adapter table ids from crates/ma-adapter-*/adapter.toml rather than naming any service in xtask
    source, which boundary.toml's literals rule confines to L4.
  task_boundaries: Does not change the tier definitions themselves, does not add a CI job, does not perform any
    manual observation, and does not add a field to adapter.toml, AdapterSpec or any other shared contract.

- title: closed-schema-fixture-guardrail
  chunk: guardrails
  contract_refs:
  - contract-closed-schema-discipline
  files:
  - crates/ma-signal/tests/phase1_schema_guard.rs
  depends_on:
