artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete
requirements:
- id: FR-001
  type: functional
  priority: must
  statement: The repository shall provide a cargo workspace whose crate graph declares the workflow core, service adapters,
    platform collectors, capture engine, and composition roots as separate crates with declared layer membership.
- id: FR-002
  type: functional
  priority: must
  statement: When the dependency-direction check runs and any crate outside a composition root depends directly, transitively,
    or through a feature gate on a service-adapter crate, the check shall exit non-zero and name the offending dependency
    path.
- id: FR-003
  type: functional
  priority: must
  statement: When a core-layer crate contains a supported-service identifier literal, the boundary check shall exit non-zero
    and name the file, line and literal.
- id: FR-004
  type: functional
  priority: must
  statement: While a session is in the recording state, if the UI process terminates, then the capture engine shall continue
    writing durable chunks and shall keep the session in the recording state.
- id: FR-005
  type: functional
  priority: must
  statement: When a client connects or reconnects to the capture engine, the engine shall return an authoritative session
    snapshot with a monotonically increasing event sequence number, and the client shall render that state rather than a locally
    inferred state.
- id: FR-006
  type: functional
  priority: must
  statement: If a client connecting to the engine control channel does not belong to the same operating-system user as the
    engine, then the engine shall refuse the connection before dispatching any method and shall record a security diagnostic
    containing no payload.
- id: FR-007
  type: functional
  priority: must
  statement: When the detector replays a recorded signal timeline with the same configuration and adapter-table version, it
    shall emit a byte-identical decision sequence across runs and processes, and every decision shall cite the signal identifiers
    it used.
- id: FR-008
  type: functional
  priority: must
  statement: Where no adapter matches the observed subject, or where a matched adapter's corroboration requirement is unmet,
    the detector shall return unknown or inconclusive respectively and the session shall fall back to manual control without
    arming.
- id: FR-009
  type: functional
  priority: must
  statement: When the browser extension reports a meeting tab without a corroborating operating-system microphone-use signal
    from the same browser process tree, the detector shall not produce a determinate start decision.
- id: FR-010
  type: functional
  priority: must
  statement: While automatic mode is active and a determinate start decision is produced, the system shall arm a cancellable
    ten-second countdown before capture begins, and cancellation shall suppress re-arming for the same meeting identity until
    that identity's signals have been continuously absent for sixty seconds.
- id: FR-011
  type: functional
  priority: must
  statement: If neither the engine-owned operating-system notification channel nor an attached client declaring indicator
    and cancel capabilities can present the countdown, then the system shall not begin automatic capture and shall record
    the suppressed decision with its cause.
- id: FR-012
  type: functional
  priority: must
  statement: When a determinate end decision is produced, the system shall hold the session for a sixty-second hysteresis
    window during which a continuing signal returns the session to recording on the same tracks without creating a new session.
- id: FR-013
  type: functional
  priority: must
  statement: The capture engine shall write each track as fixed-duration chunks that become durable by atomic rename before
    the manifest records them, bounding audio loss on abrupt termination to the single in-progress chunk.
- id: FR-014
  type: functional
  priority: must
  statement: When the engine restarts and finds a session left in the recording state, it shall recover the session from durable
    chunks under the same session identifier, mark the interruption explicitly on the timeline, and finalize rather than silently
    resume.
- id: FR-015
  type: functional
  priority: must
  statement: The recording model shall express every chunk's position as a sample offset on its own track timeline, shall
    represent missing audio as explicit gap records, and shall not derive any timestamp from concatenation order.
- id: FR-016
  type: functional
  priority: must
  statement: When track consolidation completes, the system shall verify that the decoded output is sample-identical to the
    durable chunk sequence with recorded gaps rendered as silence before deleting any chunk.
- id: FR-017
  type: functional
  priority: must
  statement: The system shall assign time-ordered unique identifiers to meetings, sessions, tracks, chunks, artifacts, workflow
    steps and exports, and shall reproduce each identifier verbatim in database rows, filesystem path segments and export
    payloads.
- id: FR-018
  type: functional
  priority: must
  statement: When a workflow step whose step key is already recorded as succeeded is enqueued again, the workflow runtime
    shall return the recorded result without re-executing any side effect.
- id: FR-019
  type: functional
  priority: must
  statement: When a processor, processor version or processor configuration changes, the workflow runtime shall derive a new
    step identity and shall retain the previous result rather than overwriting it.
- id: FR-020
  type: functional
  priority: must
  statement: The processor contract shall pass only explicitly staged input files to external processors, shall invoke them
    with an argument vector built from a manifest-declared template, and shall never construct a shell command line or place
    a secret in process arguments.
- id: FR-021
  type: functional
  priority: must
  statement: When a processor runs, it shall report monotonically non-decreasing progress at least once per work item and
    shall observe cancellation within one work item and within five seconds.
- id: FR-022
  type: functional
  priority: must
  statement: If local transcription of a two-hour recording exceeds the real-time budget, then the system shall emit a budget
    warning and shall continue the step rather than failing it.
- id: FR-023
  type: functional
  priority: must
  statement: When an export is retried after a crash or network failure, the destination shall reconcile against the recorded
    remote identity or the external-identifier marker before creating any remote object, so that no duplicate remote object
    is created.
- id: FR-024
  type: functional
  priority: must
  statement: The artifact store shall address artifacts as a root identifier plus a relative path composed only of generated
    identifiers, so that relocating the configurable artifact root does not invalidate any stored reference.
- id: FR-025
  type: functional
  priority: must
  statement: If an update or adapter manifest fails Ed25519 verification, declares a manifest version not greater than the
    installed version, or declares an artifact digest that does not match the file on disk, then the system shall reject it
    before using any value it declares.
- id: FR-026
  type: functional
  priority: must
  statement: The Phase 0 change package, its ADRs and its persistent design documents shall conform to the repository documentation
    schemas, lint target placement and status transition whitelist.
- id: FR-027
  type: functional
  priority: must
  statement: While a session is in the candidate or arming state, the system shall write no audio sample under the artifact
    root and shall persist session metadata only, so that a meeting that is detected but never recorded leaves no audio on
    durable storage.
- id: FR-028
  type: functional
  priority: must
  statement: When an armed countdown is cancelled, expires without entering the recording state, or is abandoned by a restart,
    the system shall leave no chunk file and no audio byte under the artifact root for that session.
- id: FR-029
  type: functional
  priority: must
  statement: When a user deletes a meeting, the system shall immediately make it invisible to every view, cancel its in-flight
    workflow steps, and shall purge its artifact directory and its derived rows, retaining only a tombstone carrying the meeting
    identifier, its timestamps and the identifiers of the remote objects it exported.
- id: FR-030
  type: functional
  priority: must
  statement: When a processing step executes work that loads a native inference library or runs an external program, the system
    shall execute that work in a child process supervised by the engine, so that the work's abnormal termination terminates
    only that child process.
- id: NFR-001
  type: non-functional
  priority: must
  statement: Secrets shall exist only in the operating-system credential store and shall never appear in application files,
    databases, artifacts, logs or process arguments.
- id: NFR-002
  type: non-functional
  priority: must
  statement: Diagnostic output shall contain no meeting audio, transcript text, summary text, meeting title, participant name
    or full URL.
- id: NFR-003
  type: non-functional
  priority: must
  statement: No component on the detection, capture, workflow, processing or export path shall depend on a first-party backend
    service.
- id: NFR-004
  type: non-functional
  priority: must
  statement: Local transcription without a GPU shall complete a two-hour recording within two hours of wall-clock time, with
    overrun treated as a warning.
- id: NFR-005
  type: non-functional
  priority: must
  statement: Detection inputs shall carry no DOM structure, selector, control label, screen coordinate, accessibility path
    or full URL, enforced by the closed signal envelope schema.
- id: NFR-006
  type: non-functional
  priority: must
  statement: Every outbound send shall append a local audit record naming destination, host, artifact identifier, byte count
    and outcome, and every egress host shall appear in the egress inventory.
- id: NFR-007
  type: non-functional
  priority: must
  statement: The application database shall reside under the local application-data directory regardless of the configured
    artifact root.
- id: NFR-008
  type: non-functional
  priority: must
  statement: The boundary check, the schema conformance checks, the egress inventory check and the documentation conformance
    check shall run in continuous integration on every push and pull request in the portable tier and shall block merge on
    failure, and the Windows tier shall run every registered T2 verification and shall block Phase 0 completion on failure.
- id: NFR-009
  type: non-functional
  priority: must
  statement: No crate on the capture path shall depend on the workflow, processor or destination crates, and no crate other
    than the processor host binary shall link a native inference library, so that a processing failure cannot reach the recording
    path.
- id: NFR-010
  type: non-functional
  priority: must
  statement: The contract-core crates shall build and pass their T0 and T1 verifications on a non-Windows host, and every
    T2 verification declared by this plan shall be registered in the Windows tier manifest.
