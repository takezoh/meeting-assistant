  requirement_refs:
  - FR-004
  - FR-011
  authority_refs:
  - PLAN.md section 2 automatic recording
  - PLAN.md section 6 Phase 0
  - recovery-decisions.json unknown-auto-recording-mode-definition
- id: scope-signal-persistent-state-beyond-decision-store-ownership
  kind: persistent_state
  target_ref: contract-store-ownership
  witness: 'The user decision names session state, workflow queue and export state. The store additionally holds session_transition, gap, egress_audit, roots and edit_overlay rows under the same writer table. Each is required by an observable this contract owns - explainable transitions, honest gaps, auditable egress, relocatable roots and non-destructive edits.'
  requirement_refs:
  - FR-014
  - FR-015
  - FR-017
  - FR-024
  - NFR-006
  authority_refs:
  - recovery-decisions.json unknown-db-artifact-layout
  - PLAN.md section 7
  - critique.json scope-signal-persistent-state-beyond-decision
- id: scope-signal-persistent-state-beyond-decision-workflow-step-idempotency
  kind: persistent_state
  target_ref: contract-workflow-step-idempotency
  witness: 'Beyond the workflow queue named by the user decision, the workflow runtime persists effect_ledger and generation records. Both are required by observables this contract owns - intent recorded before an effect, and a new step identity retaining rather than overwriting the previous result.'
  requirement_refs:
  - FR-018
  - FR-019
  authority_refs:
  - recovery-decisions.json unknown-db-artifact-layout
  - PLAN.md section 7
  - critique.json scope-signal-persistent-state-beyond-decision
