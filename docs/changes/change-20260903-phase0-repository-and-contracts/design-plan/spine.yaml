contracts:
- id: contract-process-topology
  dimension: state_lifecycle
  owner: component-capture-engine
  requirement_refs:
  - FR-004
  - FR-005
  - FR-017
  - NFR-003
  - FR-030
  - FR-025
  unit_refs:
  - ipc-contract-and-engine-process
  - capture-recording-durability
  adr_refs:
  - adr-20260903-capture-engine-process-isolation
  - adr-20260903-phase0-executable-contract-skeleton
  - adr-20260903-workflow-runtime-process-topology
  - adr-20260903-update-and-manifest-distribution
  verification:
  - id: v-topology-ui-kill
    tier: T2
    command: cargo test -p ma-engine --test topology ui_kill_keeps_recording
  - id: v-topology-single-instance
    tier: T2
    command: cargo test -p ma-engine --test topology second_instance_exits_without_mutation
  - id: v-topology-engine-restart-resync
    tier: T2
    command: cargo test -p ma-engine --test topology engine_restart_client_resync
  - id: v-topology-update-deferred-during-session
    tier: T2
    command: cargo test -p ma-engine --test topology update_deferred_while_session_active
- id: contract-processing-isolation
  dimension: failure_recovery
  owner: component-capture-engine
  requirement_refs:
  - NFR-009
  - FR-030
  - FR-004
  unit_refs:
  - workspace-and-boundary-scaffold
  - capture-recording-durability
  - processor-contract
  adr_refs:
  - adr-20260903-workflow-runtime-process-topology
  - adr-20260903-workspace-boundary-enforcement
  verification:
  - id: v-isolation-capture-path-edges
    tier: T0
    command: cargo xtask boundary --rule capture-path-isolation
  - id: v-isolation-native-link-confined
    tier: T0
    command: cargo xtask boundary --rule native-inference-confinement
  - id: v-isolation-negative-fixture
    tier: T1
    command: cargo test -p xtask isolation_negative_fixture
  - id: v-isolation-processor-abort-keeps-recording
    tier: T2
    command: cargo test -p ma-engine --test durability processor_abort_keeps_recording
- id: contract-ipc-protocol
  dimension: integration_contract
  owner: component-ipc-contract
  requirement_refs:
  - FR-005
  - FR-011
  - NFR-008
  unit_refs:
  - ipc-contract-and-engine-process
  - ui-shell-consent-surface
  adr_refs:
  - adr-20260903-desktop-stack-and-ipc
  verification:
  - id: v-ipc-schema-conformance
    tier: T0
    command: cargo test -p ma-ipc schema_golden_roundtrip
  - id: v-ipc-handshake-mismatch
    tier: T1
    command: cargo test -p ma-ipc handshake_major_mismatch_refused
  - id: v-ipc-resync-after-stall
    tier: T1
    command: cargo test -p ma-ipc stalled_client_resyncs
  - id: v-ipc-backpressure-never-stalls-capture
    tier: T2
    command: cargo test -p ma-engine --test topology wedged_client_does_not_stall_capture
  discretion:
  - id: discretion-jsonrpc-dispatch
    unit_ref: ipc-contract-and-engine-process
    question: How are JSON-RPC methods registered and dispatched inside the transport-agnostic protocol layer?
    scope:
      files:
      - crates/ma-ipc/src/dispatch.rs
      component: component-ipc-contract
      visibility: private
    escalate_when:
    - the wire framing, method set, error codes or event ordering guarantees would change
    - dispatch would introduce a blocking path that can stall event publication
    constraints:
    - every declared method and event in contracts/ipc/ remains reachable and schema-conformant
    preserves:
      contract_refs:
      - contract-ipc-protocol
      invariant_refs:
      - events carry strictly increasing per-connection sequence numbers
      - session transition events are never dropped
    verification_refs:
    - v-ipc-schema-conformance
    - v-ipc-resync-after-stall
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: trivial
      verification_strength: discriminating
      runtime_risk: normal
      coupling: coupled_within_unit
      grounding: evidenced
- id: contract-ipc-transport-authz
  dimension: security_boundary
  owner: component-security-policy
  requirement_refs:
  - FR-006
  - NFR-001
  unit_refs:
  - ipc-contract-and-engine-process
  - security-and-credential-policy
  adr_refs:
  - adr-20260903-desktop-stack-and-ipc
  - adr-20260903-threat-model-and-credential-policy
  verification:
  - id: v-authz-foreign-sid-rejected
    tier: T1
    command: cargo test -p ma-ipc authz_foreign_sid_rejected_before_dispatch
  - id: v-authz-dacl-shape
    tier: T1
    command: cargo test -p ma-secure acl_pipe_descriptor_owner_only
  - id: v-authz-pipe-squat
    tier: T2
    command: cargo test -p ma-engine --test topology pipe_squat_detected
  - id: v-authz-build-channel-carveout
    tier: T1
    command: cargo test -p ma-ipc authz_build_channel_carveout
  partition:
    outcomes:
    - determinate
    - unknown
    - conflicting
    default_policy: any identity check that cannot be completed is treated as a mismatch and the connection is closed before
      method dispatch; the compile-time build channel selects which server-authenticity rule applies and a release client
      never accepts an unsigned server
- id: contract-session-state-machine
  dimension: state_lifecycle
  owner: component-session-model
  requirement_refs:
  - FR-010
  - FR-011
  - FR-012
  - FR-014
  - FR-017
  - FR-027
  unit_refs:
  - session-state-machine
  adr_refs:
  - adr-20260903-automatic-recording-modes
  - adr-20260903-capture-engine-process-isolation
  verification:
  - id: v-session-table-conformance
    tier: T0
    command: cargo test -p ma-session transition_table_matches_contract_json
  - id: v-session-exhaustive-step
    tier: T1
    command: cargo test -p ma-session step_is_total_over_state_event_space
  - id: v-session-idempotent-commands
    tier: T1
    command: cargo test -p ma-session repeated_stop_is_success_without_effect
  - id: v-session-crash-in-arming
    tier: T1
    command: cargo test -p ma-session recovery_from_arming_lands_in_idle
  discretion:
  - id: discretion-state-machine-representation
    unit_ref: session-state-machine
    question: Is the state machine represented as an interpreted transition table or as typestate-style enums internally?
    scope:
      files:
      - crates/ma-session/src/state.rs
      - crates/ma-session/src/transition_table.rs
      component: component-session-model
      visibility: private
    escalate_when:
    - the exported transition table would no longer be derivable from the code
    - any declared transition would become unreachable from step
    - a transition could be applied without recording its cause
    authority:
      may_choose:
      - interpreted transition table
      - typestate enums with a derived table export
    preserves:
      contract_refs:
      - contract-session-state-machine
      invariant_refs:
      - no state is reachable except through a declared transition
      - every accepted transition records a typed cause
    verification_refs:
    - v-session-table-conformance
    - v-session-exhaustive-step
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: bounded
      verification_strength: discriminating
      runtime_risk: lifecycle
      coupling: coupled_within_unit
      grounding: evidenced
- id: contract-recording-mode-policy
  dimension: control_flow
  owner: component-session-model
  requirement_refs:
  - FR-010
  - FR-012
  - NFR-005
  - FR-028
  unit_refs:
  - session-state-machine
  adr_refs:
