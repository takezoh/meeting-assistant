units:
- title: workspace-and-boundary-scaffold
  chunk: foundation
  contract_refs:
  - contract-module-boundary-enforcement
  - contract-detector-determinism
  - contract-processing-isolation
  - contract-verification-tiering
  files:
  - Cargo.toml
  - rust-toolchain.toml
  - boundary.toml
  - verification-tiers.toml
  - deny.toml
  - xtask/Cargo.toml
  - xtask/src/main.rs
  - xtask/src/boundary.rs
  - xtask/src/verify.rs
  - xtask/tests/boundary_negative.rs
  - xtask/tests/isolation_negative.rs
  - xtask/tests/fixtures/violating-workspace/**
  - .github/workflows/ci.yml
  acceptance:
  - cargo xtask boundary exits 0 on the clean workspace and reports the number of edges checked
  - the negative fixture produces a non-zero exit naming exactly the planted forbidden edge, forbidden literal and forbidden
    import, and reports none of the three planted decoys (a doc comment containing 'must meet', a graph_edge binding, a "meeting
    ended" literal)
  - a feature-gated dependency from a non-composition-root crate onto an adapter crate is detected, and so are a capture-path
    edge onto ma-workflow and a native-inference dependency on ma-engine
  - cargo xtask verify --check-registration fails when a T2 verification id is absent from verification-tiers.toml, and CI
    defines both the portable and the windows required jobs
  objective: Create the cargo workspace with declared layers, make the module boundary and processing-isolation rules mechanically
    enforced and provably non-vacuous, and make verification tiering a build-time obligation rather than a convention.
  output_format: Rust workspace manifests, a declarative boundary.toml and verification-tiers.toml, an xtask binary with boundary
    and verify subcommands, a fixture workspace carrying violations and decoys, and a CI workflow with two required jobs.
  tool_guidance: Resolve the graph from cargo metadata with all features enabled; check transitive edges, not only direct
    ones; tokenize sources so identifiers, string literals and comments are distinguishable rather than grepping raw bytes;
    report all violations in one pass rather than stopping at the first.
  task_boundaries: Do not implement any product behaviour; do not add crates beyond empty layer placeholders needed for the
    graph; do not weaken the negative fixture to make the checker pass.
- title: core-types-and-identity
  chunk: foundation
  contract_refs:
  - contract-stable-identity
  - contract-session-timeline
  - contract-artifact-addressing
  files:
  - crates/ma-core-types/Cargo.toml
  - crates/ma-core-types/src/id.rs
  - crates/ma-core-types/src/timeline.rs
  - crates/ma-core-types/src/artifact_ref.rs
  - crates/ma-core-types/src/error.rs
  acceptance:
  - identifier types are UUIDv7, time-ordered, and serialize identically in database, path and payload contexts
  - chunks and gaps provably tile each track range with no overlap under a property test
  - a timestamp computed after a missing chunk retains its true session position
  - track descriptors carry capture_mode and contamination_risk
  objective: Fix the shared vocabulary of identifiers, session timeline arithmetic, artifact references and errors that every
    other crate depends on.
  output_format: A dependency-free Rust library crate with property tests.
  tool_guidance: Use proptest for the tiling and ordering invariants; keep the crate free of platform and I/O dependencies.
  task_boundaries: Do not add persistence, capture or IPC concerns here; do not introduce types that only one component uses.
- title: persistence-and-artifact-layout
  chunk: foundation
  contract_refs:
  - contract-artifact-addressing
  - contract-store-ownership
  - contract-stable-identity
  - contract-retention-purge
  depends_on:
  - core-types-and-identity
  files:
  - crates/ma-store/Cargo.toml
  - crates/ma-store/src/schema.rs
  - crates/ma-store/src/migration.rs
  - crates/ma-store/migrations/*.sql
  - crates/ma-store/src/repo/**
  - crates/ma-store/src/purge.rs
  acceptance:
  - no inserted row contains an absolute artifact path or a drive or UNC prefix
  - relocating the artifact root updates one row and leaves every reference resolvable
  - a write to a table outside the connection role's family is rejected
  - migrations apply forward from every released version and a newer database is refused with a typed error
  - deleting a meeting hides it in one transaction and, after the purge job runs, the meeting_id appears nowhere under the
    artifact root and in no row outside tombstone
  - a purge killed mid-walk resumes on restart and a second run is a no-op returning success
  objective: Define the relational state, its migration discipline, writer ownership and the relocatable artifact addressing
    model.
  output_format: A Rust crate with embedded SQL migrations and repository modules, plus tests against temporary directories.
  tool_guidance: Configure WAL, busy_timeout and foreign keys explicitly and assert the configuration in a test; use BEGIN
    IMMEDIATE for read-modify-write.
  task_boundaries: Do not implement workflow or export logic here; do not store any absolute path; do not make the database
    path configurable.
- title: session-state-machine
  chunk: runtime
  contract_refs:
  - contract-session-state-machine
  - contract-recording-mode-policy
  - contract-consent-surface-precondition
  depends_on:
  - core-types-and-identity
  files:
  - crates/ma-session/Cargo.toml
  - crates/ma-session/src/state.rs
  - crates/ma-session/src/transition_table.rs
  - crates/ma-session/src/mode.rs
  - crates/ma-session/src/deadline.rs
  - contracts/session/transitions.json
  acceptance:
  - the exported transition table equals contracts/session/transitions.json
  - step is total over the state and event space, returning Rejected where no transition is declared
  - a suspend and resume spanning a countdown re-evaluates instead of firing
  - an automatic start decision with no consent surface of either kind - no deliverable engine notification and no attached
    client - produces a suppression record and no capture effect, while a deliverable notification alone is sufficient to
    arm
  - no audio sample is written under the artifact root while the session is in candidate or arming, and a cancelled countdown
    leaves the meeting directory with zero chunk files
  - a detection in ask mode returns a notify effect whose action set carries start, so ask mode is satisfiable with no client
    attached, and returns a suppression with cause no_consent_surface when neither surface can present it
  objective: Fix the meeting-session lifecycle, the automatic recording mode policy, deadline semantics and the consent precondition
    as a pure, exhaustively testable function.
  output_format: A pure Rust crate plus a JSON transition table used as the conformance source of truth.
  tool_guidance: Pass time in as an argument rather than reading a clock; keep every effect a returned value rather than a
    side effect.
  task_boundaries: Do not perform I/O, start capture, or talk to the store or IPC from this crate; do not encode any service-specific
    knowledge.
