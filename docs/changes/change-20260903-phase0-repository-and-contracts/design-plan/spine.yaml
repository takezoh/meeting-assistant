  kind: persistent_state
  target_ref: contract-consent-surface-precondition
  witness: 'Beyond the durable state named by the user decision, a suppressed automatic-recording decision is persisted as its own record, because this contract owns the observable that a suppression is visible after the fact rather than silent.'
  requirement_refs:
  - FR-011
  authority_refs:
  - PLAN.md section 7
  - critique.json scope-signal-persistent-state-beyond-decision
