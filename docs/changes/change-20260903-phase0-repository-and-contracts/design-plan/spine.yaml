dispositions:
- decision_input_ref: decision-input-no-proprietary-backend
  disposition: Adopted as a binding constraint and made mechanically checkable rather than asserted. Update metadata and adapter
    enablement are verified client-side by signature and OAuth uses installed-app PKCE, so no first-party service appears
    on any workflow path; and egress-inventory.toml enumerates every host reachable from source with a closed owner enum that
    has no first-party value to write, so adding one fails the build. The rejected baseline (a thin first-party relay for
    token exchange and update metadata) is recorded in the update ADR.
  adr_refs:
  - adr-20260903-update-and-manifest-distribution
  - adr-20260903-threat-model-and-credential-policy
  contract_refs:
  - contract-release-manifest-trust
  - contract-destination-export-idempotency
  - contract-egress-inventory
- decision_input_ref: decision-input-no-dom-detection
  disposition: Adopted as a binding constraint and made structural rather than aspirational - the signal envelope is a closed
    schema with no field capable of carrying UI-derived text, so a DOM-derived fact has nowhere to live. The rejected baseline
    (UI Automation and accessibility-tree probing) is recorded in the detector ADR.
  adr_refs:
  - adr-20260903-detector-signal-replay-contract
  contract_refs:
  - contract-signal-envelope
  - contract-detector-determinism
- decision_input_ref: decision-input-capture-engine-separate-process
  disposition: 'Adopted and closed further than the decision states. The engine is a per-user single-instance process that
    owns session truth, hosts the workflow runtime, and outlives every client. The consent-surface tension is resolved in
    the engine''s favour rather than against it: the engine raises its own OS notification, so automatic recording works with
    no client attached, and only the absence of every surface suppresses a start. The rejected form (requiring an attached
    client) is recorded because it would have disabled automatic recording in the exact case this decision exists to enable.'
  adr_refs:
  - adr-20260903-capture-engine-process-isolation
  - adr-20260903-workflow-runtime-process-topology
  - adr-20260903-automatic-recording-modes
  contract_refs:
  - contract-process-topology
  - contract-consent-surface-precondition
  - contract-processing-isolation
- decision_input_ref: decision-input-desktop-stack
  disposition: 'Adopted as decided (Rust engine with windows-rs, Tauri 2 UI, whisper.cpp and sherpa-onnx bindings). Alternatives
    (.NET 8 with WinUI 3, Electron with a Rust sidecar) recorded and rejected with reasons in the stack ADR. Two consequences
    the decision leaves implicit are fixed here: the Windows Credential Manager it names is the sole secret store, discharged
    by contract-credential-custody (this is where the competing draft''s separate os-credential-store input is subsumed);
    and the package identity it names is what lets the engine raise its own notification, which the consent-surface rule now
    depends on.'
  adr_refs:
  - adr-20260903-desktop-stack-and-ipc
  - adr-20260903-workflow-runtime-process-topology
  contract_refs:
  - contract-process-topology
  - contract-ipc-protocol
  - contract-credential-custody
  - contract-consent-surface-precondition
- decision_input_ref: decision-input-ipc-mechanism
  disposition: Adopted as decided (JSON-RPC over a named pipe). Because a named pipe carries no origin concept and JSON-RPC
    carries no resync, the plan adds a SID-checked ACL contract and a snapshot-plus-sequence resync rule. Alternatives (loopback
    TCP, shared-memory ring) recorded and rejected.
  adr_refs:
  - adr-20260903-desktop-stack-and-ipc
  contract_refs:
  - contract-ipc-protocol
  - contract-ipc-transport-authz
- decision_input_ref: decision-input-boundary-toolchain
  disposition: 'Adopted as decided, and strengthened with three additions required to make the exit criterion falsifiable:
    a two-class literal scan with a declared surface alongside the dependency-direction check, a negative fixture carrying
    decoys as well as violations so precision is proven and not only detection power, and the capture-path and native-linkage
    isolation rules that turn PLAN section 7''s reliability guarantee into a graph property.'
  adr_refs:
  - adr-20260903-workspace-boundary-enforcement
  contract_refs:
  - contract-module-boundary-enforcement
  - contract-detector-determinism
  - contract-processing-isolation
- decision_input_ref: decision-input-db-artifact-layout
  disposition: 'Adopted as decided, with three derived constraints made explicit. Because the artifact root is user-configurable
    and may be a network share or removable drive, the database stays pinned under the local application-data directory and
    artifacts are addressed as a root identifier plus relative path. Because the workflow runtime now lives in the engine,
    the writer set is exactly two processes and the alternative of routing every write through the engine is recorded and
    rejected. And because the database is a projection of a directory that is the truth, deletion needs an owner: contract-retention-purge
    fixes the two-phase delete, the idempotent purge and the tombstone, while leaving the default grace value to Phase 2 per
    PLAN section 8.'
  adr_refs:
  - adr-20260903-local-store-and-artifact-layout
  - adr-20260903-workflow-runtime-process-topology
  contract_refs:
  - contract-artifact-addressing
  - contract-store-ownership
  - contract-retention-purge
- decision_input_ref: decision-input-audio-format
  disposition: Adopted as decided (16 kHz mono PCM WAV in 30 second chunks, consolidated to FLAC, optional Opus for sharing).
    The plan adds the durability ordering, the bounded loss window, and verify-before-delete consolidation. Alternatives (direct
    Opus capture, 48 kHz stereo archival) recorded and rejected.
  adr_refs:
  - adr-20260903-audio-format-and-chunking
  contract_refs:
  - contract-chunk-durability
  - contract-track-consolidation
  - contract-session-timeline
- decision_input_ref: decision-input-recording-modes
  disposition: 'Adopted as decided (auto, ask, manual with per-application override, 10 second countdown, 60 second hysteresis).
    The plan supplies every timing semantic the decision leaves open, all as fixed numbers rather than placeholders: a suspend-excluding
    clock, re-evaluation after resume, a 60 second cancel quiet period per meeting identity, a 30 second still-in-the-meeting
    prompt granting one 300 second extension, and the consent-surface rule in its engine-first form. It also fixes the durable
    footprint: no audio byte reaches the artifact root before the recording state, so cancelling is observable on disk and
    not only in the interface.'
  adr_refs:
  - adr-20260903-automatic-recording-modes
  contract_refs:
  - contract-recording-mode-policy
  - contract-consent-surface-precondition
  - contract-session-state-machine
- decision_input_ref: decision-input-initial-adapters
  disposition: Adopted as decided. Phase 0 fixes only the contract these adapters must satisfy - capability declaration, staged
    inputs, argument-vector invocation, provenance, digest-pinned model files, and execution inside a per-job ma-processor-host
    child bounded by a job object, which is what makes it safe to host the workflow runtime in the engine. The rejected baselines
    (faster-whisper via a Python sidecar, cloud-only transcription) are recorded.
  adr_refs:
  - adr-20260903-initial-processor-adapters
  - adr-20260903-workflow-runtime-process-topology
  contract_refs:
  - contract-processor-interface
  - contract-processing-isolation
- decision_input_ref: decision-input-transcription-budget
  disposition: Adopted as decided (at most 1.0x real time on CPU, mandatory progress and cancellation, overrun is a warning).
    The plan adds a cost-convergence obligation so a naive accumulating-context implementation cannot pass, and fixes cancellation
    at five seconds, which is enforceable by construction because the work runs in a killable child process. The rejected
    baseline (overrun falls back to the external API) is recorded as violating explicit-transmission consent.
  adr_refs:
  - adr-20260903-local-transcription-budget
  contract_refs:
  - contract-processor-budget
  - contract-processing-isolation
- decision_input_ref: decision-input-update-manifest-distribution
  disposition: Adopted as decided (GitHub Releases, code-signed installer, Ed25519-signed manifests, Tauri updater). The plan
    adds rollback protection, key rotation, the verify-before-use rule and the deferral of an engine replacement while a
    session is non-terminal, none of which the decision states. The deferral rule is stated by contract-release-manifest-trust
    and its check is registered under contract-process-topology, which owns engine process lifetime.
  adr_refs:
  - adr-20260903-update-and-manifest-distribution
  contract_refs:
  - contract-release-manifest-trust
  - contract-egress-inventory
  - contract-process-topology
- decision_input_ref: decision-input-meet-extension-detection-only
  disposition: 'Adopted as decided, and the transport is now closed rather than preserved. Consequences fixed: extension signals
    are non-authoritative and require corroboration by an operating-system microphone signal from the same browser process
    tree; browser loopback tracks carry a contamination-risk flag; the channel is a loopback listener with a 5 second freshness
    window and a rate cap. The native messaging alternative is recorded as rejected with the reasons and with the named evidence
    that would reverse it.'
  adr_refs:
  - adr-20260903-extension-localhost-channel-trust
  - adr-20260903-detector-signal-replay-contract
  contract_refs:
  - contract-extension-channel-trust
  - contract-detector-outcome-partition
  - contract-session-timeline
- decision_input_ref: decision-input-drive-oauth-pkce
  disposition: 'Adopted as decided. Because the drive.file scope cannot discover objects the application did not create, export
    idempotency is built on the recorded remote identity plus an external-identifier marker rather than a name search, and
    the identity is committed as an intended effect-ledger row before the remote call so the post-crash lookup has a key to
    search for. Because those objects are the user''s own files, deletion never removes them: contract-retention-purge lists
    them from the tombstone instead.'
  adr_refs:
  - adr-20260903-workflow-identity-and-idempotency
  contract_refs:
  - contract-destination-export-idempotency
  - contract-credential-custody
  - contract-retention-purge
- decision_input_ref: decision-input-notion-internal-token
  disposition: Adopted as decided. The credential contract accommodates a long-lived non-refreshable secret whose only invalidation
    signal is a 401, classified as needs-reauthentication rather than retried.
  adr_refs:
  - adr-20260903-workflow-identity-and-idempotency
  - adr-20260903-threat-model-and-credential-policy
  contract_refs:
  - contract-credential-custody
  - contract-destination-export-idempotency
- decision_input_ref: decision-input-cli-adapter-postmvp
  disposition: Deferred as decided, but its admissibility preconditions are established now - no shell invocation and explicit
    file staging - because they are cheaper to establish than to retrofit and are independently required by the cross-cutting
    security rules.
  adr_refs:
  - adr-20260903-initial-processor-adapters
  contract_refs:
  - contract-processor-interface
- decision_input_ref: decision-input-transcription-languages
  disposition: Adopted as decided. The processor capability declaration carries an explicit language set and an unsupported-language
    request is a typed refusal rather than a silent best-effort transcription.
  adr_refs:
  - adr-20260903-initial-processor-adapters
  contract_refs:
  - contract-processor-interface
- decision_input_ref: decision-input-adr-schema-shape
  disposition: Adopted as an authoring constraint on all fifteen proposed ADRs - named decision makers and a tripolar consequences
    object with a genuinely non-empty negative list.
  adr_refs:
  - adr-20260903-phase0-executable-contract-skeleton
  contract_refs:
  - contract-docs-conformance
- decision_input_ref: decision-input-docs-lint-target-placement
  disposition: Adopted. ADRs are filed flat at docs/adr/adr-YYYYMMDD-slug.md because the lint glob is non-recursive; design
    documents may nest.
  adr_refs:
  - adr-20260903-phase0-executable-contract-skeleton
  contract_refs:
  - contract-docs-conformance
- decision_input_ref: decision-input-design-doc-schema
  disposition: Adopted. Only the discipline that binds future decisions is promoted to persistent design documents - module
    boundaries including the isolation rules, session lifecycle including the pre-recording footprint invariant, the recording
    and artifact model including deletion, and trust boundaries including the egress inventory - and each invariant must name
    a mechanical check where one exists.
  adr_refs:
  - adr-20260903-phase0-executable-contract-skeleton
  contract_refs:
  - contract-docs-conformance
- decision_input_ref: decision-input-change-package-members
  disposition: Adopted. The integrator materializes requirements, implementation and verification members; leaving a required
    member empty leaves the manifest unfulfilled and blocks closure.
  adr_refs:
  - adr-20260903-phase0-executable-contract-skeleton
  contract_refs:
  - contract-docs-conformance
- decision_input_ref: decision-input-status-transition-whitelist
  disposition: 'Adopted. Every ADR is created at proposed and this plan performs no acceptance transition; the change advances
    only through its whitelisted next state. This is a lifecycle constraint, not an open design question: the decisions themselves
    are made here, and the change package records the proposed-to-accepted transition as a gate that precedes the units implementing
    the contracts each ADR binds.'
  adr_refs:
  - adr-20260903-phase0-executable-contract-skeleton
  contract_refs:
  - contract-docs-conformance
