  - id: v-processor-model-digest
    tier: T1
    command: cargo test -p ma-processor model_digest_mismatch_is_permanent_failure
  partition:
    outcomes:
    - determinate
    - unknown
    - inconclusive
    - conflicting
    default_policy: a request outside declared capability, an unverified model, or an unavailable credential produces a typed
      refusal before any work begins, never a best-effort run
  discretion:
  - id: discretion-processor-host-framing
    unit_ref: processor-contract
    question: How are requests, progress frames and the result framed between the engine supervisor and the processor host
      child?
    scope:
      files:
      - crates/ma-processor/src/host.rs
      - crates/ma-processor-host/src/main.rs
      component: component-processor-contract
      visibility: private
    escalate_when:
    - a host crash would become indistinguishable from a normal exit
    - cancellation could exceed the five-second bound
    - progress could regress or stop being observable at least once per work item
    - any secret would move into the child's argument vector
    - the engine supervisor and ma-processor-host would stop shipping and updating as one installed unit, which is the
      premise that makes this framing interior rather than a versioned surface
    constraints:
    - Delegable only because both endpoints ship in one installer and are replaced together, so no differently versioned
      peer ever reads these frames. contract-processor-interface fixes what a frame carries (a single verified request
      in, progress frames and one result frame out); this discretion fixes only how those frames are encoded.
    authority:
      may_choose:
      - length-prefixed JSON frames
      - newline-delimited JSON
      - a compact binary framing
    preserves:
      contract_refs:
      - contract-processor-interface
      - contract-processing-isolation
      invariant_refs:
      - an abnormal child exit is always classified HostCrashed, never success
      - no secret appears in the child's argument vector
    verification_refs:
    - v-processor-argv-no-shell
    - v-isolation-processor-abort-keeps-recording
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: bounded
      verification_strength: discriminating
      runtime_risk: lifecycle
      coupling: coupled_within_unit
      grounding: evidenced
