  dimension: data_model
  owner: component-store
  requirement_refs:
  - FR-029
  - FR-024
  - NFR-002
  unit_refs:
  - persistence-and-artifact-layout
  - workflow-core-contract
  adr_refs:
  - adr-20260903-local-store-and-artifact-layout
  verification:
  - id: v-purge-completeness
    tier: T1
    command: cargo test -p ma-store purge_leaves_only_tombstone
  - id: v-purge-idempotent
    tier: T1
    command: cargo test -p ma-store purge_rerun_is_idempotent
  - id: v-purge-cancels-inflight-steps
    tier: T1
    command: cargo test -p ma-workflow delete_cancels_inflight_steps
  - id: v-purge-interrupted-resumes
    tier: T2
    command: cargo test -p ma-engine --test durability killed_purge_resumes_to_completion
  partition:
    outcomes:
    - determinate
    - unknown
    - inconclusive
    default_policy: only a completed walk of a reachable artifact root writes a tombstone; an interrupted purge is unknown
      and an unreachable root is inconclusive, and both leave the meeting hidden, un-tombstoned and scheduled for retry, so
      the user is never told a meeting is gone while any byte of it remains
  discretion:
  - id: discretion-purge-walk-strategy
    unit_ref: persistence-and-artifact-layout
    question: How does the purge job walk and remove the meeting directory and its derived rows?
    scope:
      files:
      - crates/ma-store/src/purge.rs
      component: component-store
      visibility: private
    escalate_when:
    - the purge would stop being resumable from deleted_at alone
    - a tombstone could be written while any byte of the meeting remains
    - a partially purged meeting could become visible again
    - the walk would proceed past an unresolved intended effect-ledger row
    authority:
      may_choose:
      - single recursive pass
      - delete leaves then directories
      - rename to a trash directory then remove
    preserves:
      contract_refs:
      - contract-retention-purge
      invariant_refs:
      - after a tombstone exists no path or row outside tombstone names the meeting
      - purge is idempotent and convergent across restarts
    verification_refs:
    - v-purge-completeness
    - v-purge-idempotent
    - v-purge-interrupted-resumes
    difficulty_inputs:
