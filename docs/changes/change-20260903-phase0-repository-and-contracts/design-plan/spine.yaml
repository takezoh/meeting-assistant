- id: contract-credential-custody
  dimension: security_boundary
  owner: component-security-policy
  requirement_refs:
  - NFR-001
  - FR-020
  - FR-023
  unit_refs:
  - security-and-credential-policy
  adr_refs:
  - adr-20260903-threat-model-and-credential-policy
  verification:
  - id: v-credential-no-secret-in-any-written-file
    tier: T2
    command: cargo test -p ma-secure --test leak_scan planted_secret_absent_from_all_written_files
  - id: v-credential-type-not-displayable
    tier: T0
    command: cargo test -p ma-secure --test compile_fail secret_cannot_be_displayed
  - id: v-credential-argv-free
    tier: T1
    command: cargo test -p ma-processor secret_never_appears_in_child_argv
  - id: v-credential-missing-is-typed
    tier: T1
    command: cargo test -p ma-secure missing_credential_is_needs_authentication
  discretion:
  - id: discretion-secret-zeroization
    unit_ref: security-and-credential-policy
    question: Which zeroization mechanism does the secret wrapper use on drop?
    scope:
      files:
      - crates/ma-secure/src/secret.rs
      component: component-security-policy
      visibility: private
    escalate_when:
    - the type would gain a Display, Debug or Serialize implementation that reveals the value
    - exposing the inner value would stop being an explicit call at the transmission site
    - the mechanism would require the secret to be copied into an additional buffer that outlives the wrapper
    preserves:
      contract_refs:
      - contract-credential-custody
      invariant_refs:
      - no secret value is serialized by any general-purpose serializer
    verification_refs:
    - v-credential-type-not-displayable
    - v-credential-no-secret-in-any-written-file
    difficulty_inputs:
      decision_reasoning: mechanical
      boundary_reach: private
      context_scope: files
      reversibility: trivial
      verification_strength: discriminating
      runtime_risk: security
      coupling: independent
      grounding: evidenced
